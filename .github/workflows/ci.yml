name: CI

on:
  push:
    branches: [main, improve-frontend]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production
  DJANGO_DEBUG: "True"
  DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
  PYTHONUNBUFFERED: "1"

jobs:
  # ---------------------------------------------------------------------------
  backend:
  # ---------------------------------------------------------------------------
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ecomerce_test
          POSTGRES_USER: ecomerce
          POSTGRES_PASSWORD: ecomerce
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ecomerce -d ecomerce_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://ecomerce:ecomerce@localhost:5432/ecomerce_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install flake8 pytest pytest-django pytest-cov

      - name: Lint (syntax / undefined names)
        run: |
          flake8 backend/src \
            --count \
            --select=E9,F63,F7,F82 \
            --show-source \
            --statistics

      - name: Lint (style report)
        run: |
          flake8 backend/src \
            --count \
            --exit-zero \
            --max-complexity=15 \
            --max-line-length=120 \
            --statistics

      - name: Django system check
        working-directory: backend/src
        run: python manage.py check

      - name: Migration check
        working-directory: backend/src
        run: |
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput

      - name: Run tests with coverage
        working-directory: backend/src
        run: |
          python -m pytest app/tests/ -v --tb=short \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            -q

      - name: Upload coverage artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/src/coverage.xml
          retention-days: 7

  # ---------------------------------------------------------------------------
  frontend:
  # ---------------------------------------------------------------------------
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Build
        working-directory: frontend
        env:
          VITE_API_URL: http://localhost:8000
        run: npm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  # ---------------------------------------------------------------------------
  docker:
  # ---------------------------------------------------------------------------
    name: Docker build & scan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [backend, frontend]
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: ecomerce-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          push: false
          load: true
          tags: ecomerce-frontend:ci
          build-args: |
            VITE_API_URL=http://localhost:8000
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Smoke-test backend container
        run: |
          docker run -d --name backend-smoke \
            -e DJANGO_SECRET_KEY=ci-smoke \
            -e DJANGO_DEBUG=True \
            -e DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1 \
            -e SKIP_MIGRATE=0 \
            -p 18000:8000 \
            ecomerce-backend:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18000/health/; then
              echo "Backend healthy"
              docker stop backend-smoke
              exit 0
            fi
            sleep 2
          done
          docker logs backend-smoke || true
          docker stop backend-smoke || true
          exit 1

      - name: Trivy scan (backend)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ecomerce-backend:ci
          format: table
          exit-code: "0"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Trivy scan (frontend)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ecomerce-frontend:ci
          format: table
          exit-code: "0"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  # ---------------------------------------------------------------------------
  summary:
  # ---------------------------------------------------------------------------
    name: CI summary
    runs-on: ubuntu-latest
    needs: [backend, frontend, docker]
    if: always()
    steps:
      - name: Report
        run: |
          echo "Backend:  ${{ needs.backend.result }}"
          echo "Frontend: ${{ needs.frontend.result }}"
          echo "Docker:   ${{ needs.docker.result }}"
          if [ "${{ needs.backend.result }}" != "success" ] \
             || [ "${{ needs.frontend.result }}" != "success" ] \
             || [ "${{ needs.docker.result }}" != "success" ]; then
            echo "CI failed"
            exit 1
          fi
          echo "CI passed"
