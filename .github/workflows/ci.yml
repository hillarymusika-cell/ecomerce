name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production
  DJANGO_DEBUG: "True"
  DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install flake8 pytest pytest-django

      - name: Lint (critical)
        run: |
          flake8 backend/src --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Lint (style)
        run: |
          flake8 backend/src --count --exit-zero --max-complexity=12 --max-line-length=120 --statistics

      - name: Django system check
        working-directory: backend/src
        run: python manage.py check --deploy || python manage.py check

      - name: Make migrations & migrate
        working-directory: backend/src
        run: |
          python manage.py makemigrations --check --dry-run || true
          python manage.py makemigrations app --noinput || true
          python manage.py migrate --noinput

      - name: Run tests
        working-directory: backend/src
        run: |
          python -m pytest app/tests/ -v --tb=short || pytest app/tests/ -v --tb=short

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Build
        working-directory: frontend
        env:
          VITE_API_URL: http://localhost:8000
        run: npm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [backend]
    if: github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          tags: ecomerce-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
