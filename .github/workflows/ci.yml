name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

env:
  DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production
  DJANGO_DEBUG: "True"
  DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ecomerce_test
          POSTGRES_USER: ecomerce
          POSTGRES_PASSWORD: ecomerce
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ecomerce -d ecomerce_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://ecomerce:ecomerce@localhost:5432/ecomerce_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install flake8 pytest pytest-django pytest-cov pip-audit

      - name: Syntax / critical lint (must pass)
        run: |
          flake8 backend/src \
            --count \
            --select=E9,F63,F7,F82 \
            --show-source \
            --statistics

      - name: Style lint (advisory report)
        continue-on-error: true
        run: |
          flake8 backend/src \
            --count \
            --exit-zero \
            --max-complexity=15 \
            --max-line-length=120 \
            --statistics

      - name: Dependency audit (pip-audit)
        continue-on-error: true
        run: |
          pip-audit -r backend/requirements.txt --desc on || true
          echo "::notice::pip-audit completed (advisory; does not block CI)"

      - name: Django system check (deploy)
        working-directory: backend/src
        run: python manage.py check --deploy --fail-level WARNING

      - name: Uncommitted migrations check
        working-directory: backend/src
        run: |
          python manage.py makemigrations --check --dry-run
          echo "No missing migrations"

      - name: Apply migrations
        working-directory: backend/src
        run: python manage.py migrate --noinput

      - name: Run tests with coverage
        working-directory: backend/src
        run: |
          python -m pytest app/tests/ -v --tb=short \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=0 \
            -q

      - name: Upload coverage artifact
        if: always() && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/src/coverage.xml
          retention-days: 14
          if-no-files-found: warn

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            echo "::warning::No package-lock.json — using npm install (less reproducible)"
            npm install --no-audit --no-fund
          fi

      - name: npm audit (high+)
        working-directory: frontend
        continue-on-error: true
        run: |
          npm audit --audit-level=high || true
          echo "::notice::npm audit completed (advisory)"

      - name: Production build
        working-directory: frontend
        env:
          VITE_API_URL: http://localhost:8000
          NODE_ENV: production
        run: npm run build

      - name: Verify build output
        working-directory: frontend
        run: |
          test -d dist || { echo "dist/ missing after build"; exit 1; }
          test -f dist/index.html || { echo "dist/index.html missing"; exit 1; }
          js_count=$(find dist -type f \( -name '*.js' -o -name '*.mjs' \) | wc -l)
          if [ "$js_count" -lt 1 ]; then
            echo "No JS assets in dist/"
            find dist -type f | head -50
            exit 1
          fi
          echo "Build OK ($js_count JS files)"
          du -sh dist

      - name: Upload frontend artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 14

  docker:
    name: Docker build & scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend, frontend]
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: ecomerce-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          push: false
          load: true
          tags: ecomerce-frontend:ci
          build-args: |
            VITE_API_URL=http://localhost:8000
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Smoke-test backend container (fail-closed)
        run: |
          set -euo pipefail
          docker run -d --name backend-smoke \
            -e DJANGO_SECRET_KEY=ci-smoke-secret \
            -e DJANGO_DEBUG=True \
            -e DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1 \
            -e SKIP_MIGRATE=1 \
            -p 18000:8000 \
            ecomerce-backend:ci

          cleanup() {
            docker logs backend-smoke 2>&1 | tail -80 || true
            docker stop backend-smoke 2>/dev/null || true
            docker rm backend-smoke 2>/dev/null || true
          }
          trap cleanup EXIT

          ok=0
          for i in $(seq 1 40); do
            if curl -fsS --max-time 3 http://127.0.0.1:18000/health/ >/tmp/health.json 2>/dev/null; then
              echo "Health response:"
              cat /tmp/health.json
              echo
              ok=1
              break
            fi
            echo "waiting for health… ($i/40)"
            sleep 2
          done

          if [ "$ok" -ne 1 ]; then
            echo "::error::Backend container failed health check"
            exit 1
          fi
          echo "Backend smoke OK"

      - name: Smoke-test frontend container (fail-closed)
        run: |
          set -euo pipefail
          docker run -d --name frontend-smoke -p 18080:80 ecomerce-frontend:ci
          cleanup() {
            docker logs frontend-smoke 2>&1 | tail -40 || true
            docker stop frontend-smoke 2>/dev/null || true
            docker rm frontend-smoke 2>/dev/null || true
          }
          trap cleanup EXIT

          ok=0
          for i in $(seq 1 20); do
            if curl -fsS --max-time 3 -o /dev/null -w "%{http_code}" http://127.0.0.1:18080/ | grep -qE '200|301|302'; then
              ok=1
              break
            fi
            sleep 2
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::Frontend container failed to serve index"
            exit 1
          fi
          echo "Frontend smoke OK"

      - name: Trivy scan backend (fail on CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ecomerce-backend:ci
          format: table
          exit-code: "1"
          severity: CRITICAL
          ignore-unfixed: true

      - name: Trivy scan frontend (fail on CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ecomerce-frontend:ci
          format: table
          exit-code: "1"
          severity: CRITICAL
          ignore-unfixed: true

      - name: Trivy HIGH report (advisory)
        if: always()
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ecomerce-backend:ci
          format: table
          exit-code: "0"
          severity: HIGH
          ignore-unfixed: true
        continue-on-error: true

  summary:
    name: CI summary
    runs-on: ubuntu-latest
    needs: [backend, frontend, docker]
    if: always()
    steps:
      - name: Aggregate results
        run: |
          set -euo pipefail
          backend="${{ needs.backend.result }}"
          frontend="${{ needs.frontend.result }}"
          docker="${{ needs.docker.result }}"

          echo "| Job      | Result    |"
          echo "|----------|-----------|"
          echo "| Backend  | $backend  |"
          echo "| Frontend | $frontend |"
          echo "| Docker   | $docker   |"

          failed=0
          for r in "$backend" "$frontend" "$docker"; do
            case "$r" in
              success) ;;
              skipped)
                echo "::error::Required job was skipped — treating as failure"
                failed=1
                ;;
              *)
                echo "::error::Required job ended with: $r"
                failed=1
                ;;
            esac
          done

          if [ "$failed" -ne 0 ]; then
            echo "CI FAILED — deployment blocked"
            exit 1
          fi
          echo "CI PASSED — safe to deploy"
