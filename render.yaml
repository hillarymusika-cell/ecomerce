services:
  - type: web
    name: ecomerce-api
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health/
    autoDeploy: true

    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true

      - key: DJANGO_DEBUG
        value: "False"

      - key: DJANGO_ALLOWED_HOSTS
        value: "ecomerce-xw1v.onrender.com,ecomerce-api.onrender.com,adams-collections.onrender.com"

      - key: DATABASE_URL
        fromDatabase:
          name: ecomerce-db
          property: connectionString

      # Absolute origins, no trailing slash – required for browser CORS
      - key: CORS_ALLOWED_ORIGINS
        value: "https://adams-collections.onrender.com,http://localhost:5173,http://127.0.0.1:5173"

      - key: CSRF_TRUSTED_ORIGINS
        value: "https://adams-collections.onrender.com,http://localhost:5173,http://127.0.0.1:5173"

      - key: SECURE_SSL_REDIRECT
        value: "False"

      - key: FLW_SECRET_HASH
        sync: false

      - key: LOG_LEVEL
        value: "INFO"

      - key: DB_CONN_MAX_AGE
        value: "60"

      - key: JWT_ACCESS_MINUTES
        value: "60"

      - key: JWT_REFRESH_DAYS
        value: "7"

      - key: PAGE_SIZE
        value: "20"

  - type: web
    runtime: static
    name: ecomerce-frontend
    plan: free
    branch: main
    rootDir: frontend
    # No package-lock.json in repo — npm install (not ci) until a lockfile is committed
    buildCommand: npm install --no-audit --no-fund && npm run build
    staticPublishPath: dist
    autoDeploy: true

    envVars:
      - key: VITE_API_URL
        value: "https://ecomerce-xw1v.onrender.com"

databases:
  - name: ecomerce-db
    plan: free
    databaseName: ecomerce
    user: ecomerce
