services:
  - type: web
    name: ecomerce-api
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health/
    autoDeploy: true

    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true

      - key: DJANGO_DEBUG
        value: "False"

      - key: DJANGO_ALLOWED_HOSTS
        value: "ecomerce-api.onrender.com,adams-collection.onrender.com"

      - key: DATABASE_URL
        fromDatabase:
          name: ecomerce-db
          property: connectionString

      # Set in Render dashboard, e.g.
      # https://adams-collection.onrender.com,https://ecomerce-frontend.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false

      - key: CSRF_TRUSTED_ORIGINS
        sync: false

      - key: FLW_SECRET_HASH
        sync: false

      - key: LOG_LEVEL
        value: "INFO"

      - key: DB_CONN_MAX_AGE
        value: "60"

      - key: JWT_ACCESS_MINUTES
        value: "60"

      - key: JWT_REFRESH_DAYS
        value: "7"

      - key: PAGE_SIZE
        value: "20"

  - type: web
    runtime: static
    name: ecomerce-frontend
    plan: free
    branch: main
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true

    envVars:
      - key: VITE_API_URL
        sync: false

databases:
  - name: ecomerce-db
    plan: free
    databaseName: ecomerce
    user: ecomerce
